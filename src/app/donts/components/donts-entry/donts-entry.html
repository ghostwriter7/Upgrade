<div class="entry">
  <span class="title">{{ dont().title }}</span>

  <span class="streak">{{ dont().streak }} day streak</span>

  <div class="week-view">
    <span class="label">M</span>
    <span class="label">T</span>
    <span class="label">W</span>
    <span class="label">T</span>
    <span class="label">F</span>
    <span class="label">S</span>
    <span class="label">S</span>

    @for (dayStatus of dont().week; track $index) {
      <span class="dot" [ngClass]="dayStatus"></span>
    }
  </div>

  <button matButton="outlined" class="action" (click)="logSlip()">Log slip</button>
</div>
