@if (loading()) {
  <app-loader />
} @else {
  <header class="header">
    <button matFab extended [routerLink]="['/exercises', 'edit', id()]">
      <mat-icon>edit</mat-icon>
      Edit
    </button>
  </header>

  <main class="main">
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ exercise().name }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>

        <h3>Units Of Measurement</h3>
        <mat-chip-set>

          @for (unit of exercise().unitsOfMeasurement; track unit) {
            <mat-chip>{{ unit }}</mat-chip>
          } @empty {
            <mat-chip>All</mat-chip>
          }
        </mat-chip-set>

      </mat-card-content>
    </mat-card>

    <div class="logs">
      <h3>History</h3>
      <mat-divider />

      @for (log of logs.value(); track log.sessionId) {
        <mat-card>
          <mat-card-header>
            {{ log.createdAtValue }}
          </mat-card-header>
          <mat-card-content>
            @if (log.notes) {
              <p class="notes">{{ log.notes }}</p>
            }
            <app-progress-gallery [exerciseLogId]="log.id" />
            <app-exercise-log-summary [exerciseLog]="log" />
          </mat-card-content>
        </mat-card>
      }
    </div>
  </main>

}
