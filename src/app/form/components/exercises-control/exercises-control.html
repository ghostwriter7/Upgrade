@if (selectedIds().length) {
  <mat-list cdkDropList (cdkDropListDropped)="onDrop($event)">
    @for (id of selectedIds(); track id) {
      <mat-list-item cdkDrag>
        <div class="entry">
          {{ id | exerciseName }}
          <mat-icon (click)="remove($index)">close</mat-icon>
        </div>
      </mat-list-item>
    }
  </mat-list>
}

<mat-selection-list
  [disabled]="disabled()"
  (selectionChange)="handleSelectionChange($event)"
>
  @for (exercise of visibleExercises(); track exercise.id) {
    <mat-list-option
      togglePosition="after"
      [value]="exercise.id"
    >
      <span matListItemTitle>{{ exercise.name }}</span>
    </mat-list-option>
  }
</mat-selection-list>
