<button data-testid="backup-export-data-btn" class="info" matFab extended [disabled]="loading()" (click)="exportData()">
  <mat-icon>file_export</mat-icon>
  Export Data
</button>
<button data-testid="backup-import-data-btn" class="info" matFab extended [disabled]="loading()" (click)="importData()">
  <mat-icon>upload</mat-icon>
  Import Data
</button>

@if (loading()) {
  <app-loader data-testid="backup-loader" />
} @else if (error(); as error) {
  <div data-testid="backup-error-message" class="error-message">
    {{ error }}
  </div>
}
