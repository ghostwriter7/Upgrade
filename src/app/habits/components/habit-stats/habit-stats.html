<div class="stats">
  <div class="stat">
    <span class="value">{{ weekSlipCount() }}</span>
    <span class="label">slip this week</span>
  </div>

  @if (bestStreak(); as best) {
    <div class="stat">
      <span class="value">{{ best.streak }} ({{ best.name }})</span>
      <span class="label">day longest streak</span>
    </div>
  }
</div>
