<div class="entry">
  <span class="title">{{ habit().title }}</span>

  <span class="streak">{{ habit().streak }} day streak</span>

  <div class="week-view">
    <span class="label">M</span>
    <span class="label">T</span>
    <span class="label">W</span>
    <span class="label">T</span>
    <span class="label">F</span>
    <span class="label">S</span>
    <span class="label">S</span>

    @for (dayStatus of habit().week; track $index) {
      <span class="dot" [class]="dayStatus"></span>
    }
  </div>

  <div class="statistics">
    <div class="stat">
      <span class="stat-value">{{ habit().longestStreak }}</span>
      <span class="stat-label">Longest streak</span>
    </div>

    <div class="stat">
      <span class="stat-value">{{ habit().totalSlips }}</span>
      <span class="stat-label">Total slips</span>
    </div>

    <div class="stat">
      <span class="stat-value">{{ habit().trackedForDays }}</span>
      <span class="stat-label">Days tracked</span>
    </div>
  </div>

  <button matButton="outlined" class="action" (click)="logSlip()">Log slip</button>
</div>
