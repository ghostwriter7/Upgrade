@for (entry of entries(); track entry.label) {
  @if (entry.isVisible) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>
          <div class="header">
            <mat-icon>{{ entry.icon }}</mat-icon>
            {{  entry.label }}
          </div>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-action-list>
          @for (exercise of entry.entries; track exercise.id) {
            <button mat-list-item (click)="exerciseSelected.emit(exercise.id)">{{ exercise.name }}</button>
          }
        </mat-action-list>
      </mat-card-content>
    </mat-card>
  }
}
