<mat-form-field class="full-width">
  <mat-label>Exercise</mat-label>
  <input type="text"
         placeholder="Pick one"
         aria-label="Exercise"
         matInput
         [formField]="exerciseForm.exercise"
         [matAutocomplete]="auto">
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayExercise"
    (optionSelected)="exerciseSelected.emit($event.option.value.id)">
    @for (exercise of options(); track exercise) {
      <mat-option [value]="exercise">{{ exercise.name }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
