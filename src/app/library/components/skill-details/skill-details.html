@let value = skill();
<header class="actions">
  <button matFab extended class="danger" commandfor="confirm" command="show-modal">
    <mat-icon>delete</mat-icon>
    Delete
  </button>

  <button matFab extended [routerLink]="['/skills', 'edit', value?.id]">
    <mat-icon>edit</mat-icon>
    Edit
  </button>
</header>

<main class="content">

  @if (value) {

    <mat-card>
      <mat-card-header class="header">
        <mat-card-title>{{ value.name }}</mat-card-title>

        @if (value.isFavourite) {
          <mat-icon class="ml-auto">star</mat-icon>
        }


      </mat-card-header>

      <mat-card-content>
        <h3>Exercises</h3>
        <mat-divider />

        <mat-list>
          @for (exercise of exercises(); track exercise.id) {
            <mat-list-item [routerLink]="['/exercises', exercise.id]">
              {{ exercise.name }}
            </mat-list-item>
          }
        </mat-list>

      </mat-card-content>
    </mat-card>

  } @else {
    <app-loader />
  }
</main>

<footer class="footer">
  <button matFab extended [routerLink]="['/skills']">
    <mat-icon>trophy</mat-icon>
    Skills
  </button>

  <button matFab extended [routerLink]="['/exercises']">
    <mat-icon>fitness_center</mat-icon>
    Exercises
  </button>
</footer>

<app-confirm title="Confirm" [message]="confirmDeleteMessage()" (confirm)="deleteSkill()" />
