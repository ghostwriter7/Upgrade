<mat-card>
  <mat-card-header class="exercise-header" (click)="activateActions()">
    <mat-card-title>{{ entry().exerciseId | exerciseName }}</mat-card-title>

    @if (displayActions()) {
      <div class="actions">
        <button matMiniFab (click)="activateVideoCapture($event, entry().exerciseId)"><mat-icon>video_camera_front</mat-icon></button>
        <button matMiniFab (click)="showSetForm($event, entry().exerciseId)"><mat-icon>add</mat-icon></button>
        @if (!entry().isEmpty) {
          <button matMiniFab (click)="copyLastSet($event, entry().exerciseId)"><mat-icon>content_copy</mat-icon></button>
        }
        <button matMiniFab (click)="editExerciseNote($event, entry())"><mat-icon>note_add</mat-icon></button>
        <button matMiniFab class="danger" [disabled]="isNonDeletable()" (click)="deleteExercise($event, entry())"><mat-icon>delete</mat-icon></button>
      </div>
    }
  </mat-card-header>
  <mat-card-content>
    @if (entry().notes) {
      <p>{{ entry().notes }}</p>
    }
    <mat-list role="list">
      @for (set of entry().sets; track $index) {
        <mat-list-item role="listitem">
          <app-set-view
            [set]="set"
            [index]="$index"
            [exerciseId]="entry().exerciseId"
            [isEditable]="isEditable()"
          />
        </mat-list-item>
      }
    </mat-list>

    @if (setFormActiveForExerciseId() === entry().exerciseId) {
      <app-add-set-form
        [exerciseLog]="entry()"
        (newSet)="addSet($event, entry().exerciseId)"
        (cancelAddSet)="onCancelAddSet()"
      />
    }
  </mat-card-content>
</mat-card>
