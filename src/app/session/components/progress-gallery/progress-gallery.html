<div class="carousel">
  @for (entry of mediaWithMeasurements(); track entry) {
    <div class="slide">
      @if (entry.angle; as angle) {
        <app-lozenge class="angle-lozenge">
          {{ angle }}°
        </app-lozenge>
      }

      <app-image-renderer
        [width]="entry.width"
        [height]="entry.height"
        [image]="entry.image"
        [lines]="entry.lines"
        [points]="entry.points"
      />

    </div>
  }
</div>
