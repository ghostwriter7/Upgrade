<div class="carousel" (scrollend)="onScroll($event)" (click)="toggleActions()">
  @if (showCounter()) {
    <div class="counter">{{ current() }} / {{ total() }}</div>
  }

  @if (showActions()) {
    <button mat-mini-fab class="download-btn" (click)="onDownload()">
      <mat-icon>download</mat-icon>
    </button>
  }


  @for (entry of mediaWithMeasurements(); track entry) {
    <div class="slide">

      @if (entry.angle; as angle) {
        <app-lozenge class="angle-lozenge">
          {{ angle }}°
        </app-lozenge>
      }

      <app-image-renderer
        [width]="entry.width"
        [height]="entry.height"
        [image]="entry.image"
        [lines]="entry.lines"
        [points]="entry.points"
      />

    </div>
  }
</div>
