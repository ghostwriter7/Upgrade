<h2 mat-dialog-title>Record</h2>
<mat-dialog-content class="content">
  <video playsinline muted #video></video>
</mat-dialog-content>
<mat-dialog-actions>
  @if (isRecording()) {
    <button matFab extended (click)="stop()">
      <mat-icon>stop</mat-icon>
      Stop
    </button>
  } @else {
    <div class="edit-actions">
      <mat-slider class="slider" min="0" [max]="duration()" step="0.01">
        <input [formField]="form.frameAt" matSliderThumb>
      </mat-slider>
      <div class="buttons">
        <button matFab extended (click)="captureFrame()">
          Capture
        </button>
      </div>
    </div>
  }
</mat-dialog-actions>
