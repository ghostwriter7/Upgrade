<app-session-list [date]="date()" />

<footer>
  <button data-testid="session-page-previous-day-btn" class="info" matMiniFab aria-label="Show previous day"
          (click)="showPreviousDay()">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <span data-testid="session-page-date-label">{{ label() }}</span>

  <button data-testid="session-page-next-day-btn" class="info" matMiniFab aria-label="Show next day"
          (click)="showNextDay()">
    <mat-icon>chevron_right</mat-icon>
  </button>
</footer>
