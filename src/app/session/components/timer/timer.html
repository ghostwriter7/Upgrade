<mat-card class="card">
  <mat-card-content class="content">
    <span class="display-value">{{ displayValue() }}</span>
    <div class="actions">
      <button class="success" matMiniFab (click)="start()">
        <mat-icon>play_arrow</mat-icon>
      </button>

      <button class="info" matMiniFab (click)="pause()">
        <mat-icon>pause</mat-icon>
      </button>

      <button class="danger" matMiniFab (click)="reset()">
        <mat-icon>clear</mat-icon>
      </button>
    </div>
  </mat-card-content>
</mat-card>
