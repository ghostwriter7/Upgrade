<button
  [attr.data-testid]="testIds.menu"
  class="ml-auto info"
  matMiniFab
  aria-label="Show session context menu"
  [matMenuTriggerFor]="menu">
  <mat-icon>menu</mat-icon>
</button>
<mat-menu #menu="matMenu">
  @if (showEdit()) {
    <button
      [attr.data-testid]="testIds.edit"
      mat-menu-item (click)="triggerEdit()">
      <mat-icon>edit</mat-icon>
      Edit
    </button>
  }
  <button
    [attr.data-testid]="testIds.delete"
    mat-menu-item class="danger" (click)="deleteSession()">
    <mat-icon>delete_forever</mat-icon>
    Delete
  </button>
</mat-menu>
