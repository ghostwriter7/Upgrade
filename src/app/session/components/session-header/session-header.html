<header>
  <div class="row">
    <button
      [attr.data-testid]="testIds.startedAt"
      matFab extended
      [class.no-events]="isNonEditable()"
      (click)="editStartedAt()">
      <mat-icon>access_time</mat-icon>
      <span [attr.data-testid]="testIds.startedAtValue">{{ startedAt() }}</span>
    </button>
    @if (finishedAt(); as finishedAt) {
      <button
        [attr.data-testid]="testIds.finishedAt"
        matFab extended
        [class.no-events]="isNonEditable()"
        (click)="editFinishedAt()">
        <mat-icon>access_time_filled</mat-icon>
        <span [attr.data-testid]="testIds.finishedAtValue">{{ finishedAt }}</span>
      </button>
    }
    @if (duration(); as duration) {
      <span
        class="metadata">
        <mat-icon>hourglass_empty</mat-icon>
        <span [attr.data-testid]="testIds.duration">{{ duration }}</span>
      </span>
    }

    <app-session-header-menu [session]="session()" [isNew]="isNew()" />
  </div>
</header>
