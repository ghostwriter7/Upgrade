@switch (this.activeStep()) {
  @case ('record') {
    <app-recorder (videoCapture)="onVideoCapture($event)" />
    @if (videoData) {
      <div class="actions">
        <app-icon-button icon="movie_edit" (click)="goTo('crop-video')">
          Video
        </app-icon-button>
        <app-icon-button icon="add_a_photo" (click)="goTo('pick-frame')">
          Image
        </app-icon-button>
      </div>
    }
  }
  @case ('pick-frame') {
    <app-frame-picker [data]="videoData!" (framePick)="onFramePick($event)" #framePicker>
      <app-icon-button icon="save" (click)="saveImage()">
        Save
      </app-icon-button>

      <app-icon-button icon="arrow_range" (click)="measureAngles()">
        Measure
      </app-icon-button>
    </app-frame-picker>
  }
  @case ('measure') {
    <app-pose-measure-editor [data]="frameData!" (angleConfirm)="onAngleConfirm($event)" />
  }
  @case ('crop-video') {
    <app-video-editor [data]="videoData!" />
  }
}
