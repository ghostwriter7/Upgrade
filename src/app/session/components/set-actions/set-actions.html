<div class="actions">
  <button data-testid="set-actions-copy-btn" matMiniFab (click)="copySet($event)">
    <mat-icon>update</mat-icon>
  </button>
  <button data-testid="set-actions-edit-btn" matMiniFab (click)="editSet($event)">
    <mat-icon>edit</mat-icon>
  </button>
  <button data-testid="set-actions-delete-btn" matMiniFab class="danger" (click)="deleteSet($event)">
    <mat-icon>delete</mat-icon>
  </button>
</div>
