@switch (this.activeStep()) {
  @case ('record') {
    <app-recorder (videoCapture)="onVideoCapture($event)" />
  }
  @case ('pick-frame') {
    <app-frame-picker [data]="videoData!" (framePick)="onFramePick($event)" #framePicker>
      <button matFab extended (click)="saveImage()">
        <mat-icon>save</mat-icon>
        Save
      </button>

      <button matFab extended (click)="measureAngles()">
        <mat-icon>arrow_range</mat-icon>
        Measure
      </button>
    </app-frame-picker>
  }
  @case ('measure') {
    <app-pose-measure-editor [data]="frameData!" (angleConfirm)="onAngleConfirm($event)" />
  }
}
