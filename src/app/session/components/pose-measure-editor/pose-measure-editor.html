@let details = data();

<div class="buttons">
  <button class="info" matMiniFab (click)="undo()">
    <mat-icon>undo</mat-icon>
  </button>
  <button class="info" matMiniFab (click)="clearAll()">
    <mat-icon>clear_all</mat-icon>
  </button>
  <button matMiniFab (click)="save()">
    <mat-icon>save</mat-icon>
  </button>

  @if (angle(); as angle) {
    <app-lozenge>
      {{ angle }}°
    </app-lozenge>
  }
</div>

<app-image-renderer
  [lines]="lines()"
  [points]="points()"
  [image]="details.image"
  [height]="details.height"
  [width]="details.width"
  [class.no-events]="allPointsCaptured()"
  (pointerdown)="handleClick($event)"
  #imageRenderer
/>
