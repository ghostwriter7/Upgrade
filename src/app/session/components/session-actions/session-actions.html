<div class="actions">
  @if (isUnfinished()) {
    <button data-testid="session-actions-complete-btn" matFab extended [disabled]="isSessionInvalid()"
            (click)="completeSession()">
      <mat-icon>save</mat-icon>
      Complete
    </button>
  } @else {
    <button data-testid="session-actions-cancel-btn" class="info" matFab extended (click)="cancelEdit()">
      <mat-icon>cancel</mat-icon>
      Cancel
    </button>
  }

  <button data-testid="session-actions-add-exercise-btn" matFab extended (click)="showExerciseDialog()">
    <mat-icon>add</mat-icon>
    Skill
  </button>
</div>
