<div class="actions">
  @if (isUnfinished()) {
    <button data-testid="session-actions-complete-btn" matMiniFab [disabled]="isSessionInvalid()"
            (click)="completeSession()">
      <mat-icon>save</mat-icon>
    </button>
  } @else {
    <button data-testid="session-actions-cancel-btn" class="info" matMiniFab (click)="cancelEdit()">
      <mat-icon>cancel</mat-icon>
    </button>
  }

  <button data-testid="session-actions-add-exercise-btn" matMiniFab (click)="showExercises.emit()">
    <mat-icon>add</mat-icon>
  </button>
</div>
