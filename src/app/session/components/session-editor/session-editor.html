<div class="session-editor">
  <app-session-header [isEditable]="true" [isNew]="isNew()" [session]="session()!" />

  @for (entry of session()?.exerciseLogs; track entry.exerciseId) {
    <app-exercise-card
      [exerciseLog]="entry"
      [isNonDeletable]="$count === 1"
      [isEditable]="true"
    />
  }

  <app-session-actions (showExercises)="showAddExercises.set(true)" />
</div>

<app-timer />

@if (showAddExercises()) {
  <app-add-exercises
    [exercises]="exercises()"
    (confirmed)="onAddExercises($event)"
    (cancelled)="showAddExercises.set(false)"
  />
}
