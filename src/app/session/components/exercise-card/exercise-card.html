<mat-card>
  @let ids = testIds();
  <mat-card-header
    [attr.data-testid]="ids.exerciseCardHeader" class="exercise-header"
    (click)="activateActions()">
    <mat-card-title>{{ entry().exerciseId | exerciseName }}</mat-card-title>

    @if (displayActions()) {
      <app-exercise-card-actions [entry]="entry()" [isNonDeletable]="isNonDeletable()" />
    }
  </mat-card-header>
  <mat-card-content>
    @if (entry().notes) {
      <p>{{ entry().notes }}</p>
    }

    <app-progress-gallery [exerciseLogId]="entry().id" />

    <mat-list role="list">
      @for (set of entry().sets; track $index) {
        <mat-list-item role="listitem">
          <app-set-view [set]="set" [isEditable]="isEditable()" />
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
