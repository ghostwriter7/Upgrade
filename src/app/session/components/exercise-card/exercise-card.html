<mat-card>
  @let ids = testIds();
  <mat-card-header
    [attr.data-testid]="ids.exerciseCardHeader" class="exercise-header"
    (click)="activateActions()">
    <mat-card-title>{{ entry().exerciseId | exerciseName }}

      @if (hasMedia()) {
        <button [attr.data-testid]="ids.showMediaButton" matMiniFab (click)="showMedia()">
          <mat-icon>perm_media</mat-icon>
        </button>
      }
    </mat-card-title>

    @if (displayActions()) {
      <app-exercise-card-actions [entry]="entry()" [isNonDeletable]="isNonDeletable()"/>
    }
  </mat-card-header>
  <mat-card-content>
    @if (entry().notes) {
      <p>{{ entry().notes }}</p>
    }
    <mat-list role="list">
      @for (set of entry().sets; track $index) {
        <mat-list-item role="listitem">
          <app-set-view [set]="set" [isEditable]="isEditable()" />
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
