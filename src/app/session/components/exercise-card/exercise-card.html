<mat-card>
  @let ids = testIds();
  <mat-card-header
    [attr.data-testid]="ids.exerciseCardHeader" class="exercise-header"
    (click)="activateActions()">
    <mat-card-title>{{ entry().exerciseId | exerciseName }}

      @if (hasMedia()) {
        <button matMiniFab (click)="showMedia()">
          <mat-icon>perm_media</mat-icon>
        </button>
      }
    </mat-card-title>

    @if (displayActions()) {
      <div class="actions">
        <button matMiniFab (click)="activateVideoCapture($event, entry().exerciseId)">
          <mat-icon>video_camera_front</mat-icon>
        </button>
        <button [attr.data-testid]="ids.showSetFormButton" matMiniFab (click)="showSetForm($event, entry().exerciseId)">
          <mat-icon>add</mat-icon>
        </button>
        <button [attr.data-testid]="ids.editNoteButton" matMiniFab (click)="editNote($event, entry())">
          <mat-icon>note_add</mat-icon>
        </button>
        <button [attr.data-testid]="ids.deleteButton" matMiniFab class="danger" [disabled]="isNonDeletable()"
                (click)="deleteExercise($event, entry())">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </mat-card-header>
  <mat-card-content>
    @if (entry().notes) {
      <p>{{ entry().notes }}</p>
    }
    <mat-list role="list">
      @for (set of entry().sets; track $index) {
        <mat-list-item role="listitem">
          <app-set-view [set]="set" [isEditable]="isEditable()" />
        </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
