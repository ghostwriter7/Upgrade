<svg #svg [attr.viewBox]="viewBox()">
  <image [attr.href]="image()" [attr.width]="width()" [attr.height]="height()" />

  @for (line of lines(); track line) {
    <line
      class="line"
      [attr.x1]="line.start.x"
      [attr.y1]="line.start.y"
      [attr.x2]="line.end.x"
      [attr.y2]="line.end.y"
    />
  }

  @for (point of points(); track point) {
    <circle
      class="point"
      [attr.cx]="point.x"
      [attr.cy]="point.y"
      r="6"
    />
  }

</svg>
