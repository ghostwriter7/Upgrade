<label class="row" [class.selected]="selected()">
  <input class="visually-hidden" type="checkbox" [checked]="selected()" (change)="toggled.emit()" />

  <span class="tile" [attr.data-type]="exercise().type" aria-hidden="true">
    @switch (exercise().type) {
      @case ('strength') {
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12" /></svg>
      }
      @case ('isometric') {
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7" /><path d="M12 10v3l2 1M9 3h6" /></svg>
      }
      @case ('flexibility') {
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 17c4 0 5-10 9-10s5 10 9 10" /></svg>
      }
      @default {
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="3" /></svg>
      }
    }
  </span>

  <span class="text">
    <span class="name">
      <span class="name-text">{{ exercise().name }}</span>
      @if (exercise().isFavourite) {
        <svg class="fav" viewBox="0 0 24 24" role="img" aria-label="Favourite">
          <path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z" />
        </svg>
      }
    </span>
    <span class="meta"><span [class.overdue]="overdue()">{{ lastDoneText() }}</span> · {{ typeLabel() }}</span>
  </span>

  <span class="check" aria-hidden="true">{{ order() }}</span>
</label>
