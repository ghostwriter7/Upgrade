<h2 mat-dialog-title>Exercises</h2>
<mat-dialog-content>
  <mat-selection-list (selectionChange)="handleSelectionChange($event)">
    @for (exercise of availableExercises(); track exercise.id) {
      <mat-list-option togglePosition="after" [value]="exercise.id">
        <span matListItemTitle>{{ exercise.name }}</span>
      </mat-list-option>
    }
  </mat-selection-list>
</mat-dialog-content>
<mat-dialog-actions>
  <button
    data-testid="exercise-selector-add-btn"
    class="success"
    matButton
    [disabled]="hasNoneSelected()"
    [mat-dialog-close]="selectedExerciseIds()">Add</button>
  <button data-testid="exercise-selector-cancel-btn" class="info" matButton mat-dialog-close>Cancel</button>
</mat-dialog-actions>
