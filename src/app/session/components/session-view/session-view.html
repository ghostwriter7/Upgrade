<div class="session-view">
  <app-session-header [isNew]="isNew()" [session]="editedSession()" />

  @for (entry of editedSession().exercises; track entry.exerciseId) {
    <app-exercise-card [entry]="entry" [isNonDeletable]="$count === 1"/>
  }

  <app-session-actions />
</div>

@if (isEditable()) {
  <app-timer />
}
