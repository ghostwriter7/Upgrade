<div class="info">
  {{ displayValue() }}

  <button matMiniFab aria-label="Show context menu" [matMenuTriggerFor]="menu" >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="editSet.emit()">Edit</button>
    <button mat-menu-item (click)="deleteSet.emit()">Delete</button>
  </mat-menu>
</div>
