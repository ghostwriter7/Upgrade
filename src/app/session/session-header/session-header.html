<header>
  @let testId = testIds();
  <div class="row">
    <button
      [attr.data-testid]="testId.startedAt" matFab extended
      (click)="editStartedAt()">
      <mat-icon>access_time</mat-icon>
      <span [attr.data-testid]="testId.startedAtValue">{{ startedAt() }}</span>
    </button>
    @if (finishedAt(); as finishedAt) {
      <button
        [attr.data-testid]="testId.finishedAt"
        matFab extended (click)="editFinishedAt()">
        <mat-icon>access_time_filled</mat-icon>
        <span [attr.data-testid]="testId.finishedAtValue">{{ finishedAt }}</span>
      </button>
    }
    @if (duration(); as duration) {
      <span
        class="metadata">
        <mat-icon>hourglass_empty</mat-icon>
        <span [attr.data-testid]="testId.duration">{{ duration }}</span>
      </span>
    }

    <button
      [attr.data-testid]="testId.menu"
      class="ml-auto info" matMiniFab aria-label="Show session context menu" [matMenuTriggerFor]="menu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      @if (isFinal()) {
        <button mat-menu-item (click)="triggerEdit()">
          <mat-icon>edit</mat-icon>
          Edit
        </button>
      }
      <button mat-menu-item class="danger" (click)="deleteSession()">
        <mat-icon>delete_forever</mat-icon>
        Delete
      </button>
    </mat-menu>

  </div>
</header>
