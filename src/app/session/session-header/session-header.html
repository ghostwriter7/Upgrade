<header>
  <div class="row">
    <button matFab extended (click)="editStartedAt()">
      <mat-icon>access_time</mat-icon>
      {{ startedAt() }}
    </button>
    @if (finishedAt(); as finishedAt) {
      <button matFab extended (click)="editFinishedAt()">
        <mat-icon>access_time_filled</mat-icon>
        {{ finishedAt }}
      </button>
    }
    @if (duration(); as duration) {
      <span class="metadata">
        <mat-icon>hourglass_empty</mat-icon>
        {{ duration }}
      </span>
    }

    <button class="ml-auto info" matMiniFab aria-label="Show session context menu" [matMenuTriggerFor]="menu">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      @if (isFinal()) {
        <button mat-menu-item (click)="editStart.emit()">
          <mat-icon>edit</mat-icon> Edit
        </button>
      }
      <button mat-menu-item class="danger" (click)="deleteSession()">
        <mat-icon>delete_forever</mat-icon> Delete
      </button>
    </mat-menu>

  </div>
</header>
