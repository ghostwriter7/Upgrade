@if (showForm()) {
  <mat-form-field class="full-width" appearance="outline">
    <mat-label>Set Type</mat-label>
    <mat-select [formField]="setForm.type">
      @for (option of setTypeOptions; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (!setForm.duration().hidden()) {
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Duration</mat-label>
      <input [formField]="setForm.duration" type="number" matInput placeholder="Duration in seconds">
    </mat-form-field>
  }

  @if (!setForm.reps().hidden()) {
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Reps</mat-label>
      <input [formField]="setForm.reps" matInput type="number" placeholder="Number of reps">
    </mat-form-field>
  }

  @if (!setForm.weight().hidden()) {
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Weight</mat-label>
      <input [formField]="setForm.weight" matInput type="number" placeholder="Weight (kg)">
    </mat-form-field>
  }

  <div class="actions">
    <button matButton="filled" [disabled]="setForm().invalid()" (click)="addSet()">Add</button>
    <button matButton="outlined" (click)="showForm.set(false)">Cancel</button>
  </div>
} @else {
  <button matMiniFab aria-label="Show set form" (click)="showForm.set(true)">
    <mat-icon>add</mat-icon>
  </button>
}
