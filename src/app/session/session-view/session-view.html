<div class="session-view">
  <app-session-header
    [isNew]="isNew()"
    [session]="editedSession()"
    (finishedAtChange)="onFinishedAtChange($event)"
    (startedAtChange)="onStartedAtChange($event)"
  />

  @for (entry of editedSession().exercises; track entry.exerciseId) {
    <mat-card>
      <mat-card-header class="exercise-header">
        <mat-card-title>{{ entry.exerciseId | exerciseName }}</mat-card-title>
        <button class="ml-auto info" matMiniFab aria-label="Show exercise context menu" [matMenuTriggerFor]="menu">
          <mat-icon>menu</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button class="danger" mat-menu-item [disabled]="$count === 1" (click)="deleteExercise(entry)">Delete</button>
          <button mat-menu-item (click)="editExerciseNote(entry)">Notes</button>
        </mat-menu>
      </mat-card-header>
      <mat-card-content>
        @if (!isEditable() && entry.notes) {
          <p>{{ entry.notes }}</p>
        }
        <mat-list role="list">
          @for (set of entry.sets; track $index) {
            <mat-list-item role="listitem">
              <app-set-view
                [set]="set"
                (deleteSet)="deleteSet(entry.exerciseId, $index)"
                (editSet)="editSet(entry.exerciseId, set, $index)"
              />
            </mat-list-item>
          }
        </mat-list>

        @if (isEditable()) {
          <app-add-set-form
            [exerciseLog]="entry"
            (newSet)="addSet($event, entry.exerciseId)"
          />
        }
      </mat-card-content>
    </mat-card>
  }

  @if (isEditable()) {
    <button
      matButton="filled"
      (click)="showExerciseDialog()">
      Add
    </button>

    <button class="full-width" matButton="filled" [disabled]="isSessionInvalid()" (click)="completeSession()">
      Complete Session
    </button>
  }
</div>

@if (isNew()) {
  <app-timer />
}
