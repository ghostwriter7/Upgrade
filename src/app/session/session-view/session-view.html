<div class="session-view">

  @if (hasLeftExercises()) {
    <mat-form-field class="full-width" appearance="outline">
      <mat-label>Exercises</mat-label>
      <mat-select [formField]="exerciseField.exerciseId">
        @for (exercise of availableExercises(); track exercise.uuid) {
          <mat-option [value]="exercise.uuid">{{ exercise.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button class="full-width" matButton="filled" [disabled]="exerciseField.exerciseId().invalid()" (click)="addExerciseEntry()">
      Add
    </button>
  }

  @for (entry of exerciseDate(); track entry.exerciseId) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ entry.exerciseId | exerciseName }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-list role="list">
          @for (set of entry.sets; track $index) {
            <mat-list-item role="listitem">
              <app-set-view
                [set]="set"
                (deleteSet)="deleteSet(entry.exerciseId, $index)"
                (editSet)="editSet(entry.exerciseId, set, $index)"
              />
            </mat-list-item>
          }
        </mat-list>

        <app-add-set-form
          [exerciseId]="entry.exerciseId"
          (newSet)="addSet($event, entry.exerciseId)"
        />

      </mat-card-content>
    </mat-card>
  }

  <button class="full-width" matButton="filled" [disabled]="isSessionInvalid()" (click)="completeSession()">
    Complete Session
  </button>
</div>
