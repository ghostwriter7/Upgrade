@if (showForm()) {
  <app-target-form [target]="targetStore.editedTarget()" (saved)="targetStore.save($event)"
                   (cancelled)="targetStore.setShowForm(false)" />
} @else {
  <app-icon-button icon="add" class="full-width" (click)="targetStore.setShowForm(true)">Create</app-icon-button>
  <mat-divider />
  <app-target-list [targets]="targets()" />
}
