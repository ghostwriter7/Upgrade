<div class="nav">
  <button data-testid="session-calendar-show-prev-month" matMiniFab aria-label="Show previous month"
          (click)="showPreviousMonth()">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <span data-testid="session-calendar-month-label">{{ label() }}</span>

  <button data-testid="session-calendar-show-next-month" matMiniFab aria-label="Show next month"
          (click)="showNextMonth()">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
<div class="calendar">
  <div class="weekday">Mon</div>
  <div class="weekday">Tue</div>
  <div class="weekday">Wed</div>
  <div class="weekday">Thu</div>
  <div class="weekday">Fri</div>
  <div class="weekday">Sat</div>
  <div class="weekday">Sun</div>

  @for (cell of calendarCells(); track $index) {
    <div
      class="cell"
      [attr.data-testid]="cell.testId"
      [class.highlight]="cell.hasSessions"
      [class.empty]="cell.day === null"
      [ngClass]="cell.rpeClass"
      [routerLink]="['/session', cell.date]"
    >
      @if (cell.day !== null) {
        <span class="day">{{ cell.day }}</span>
        @if (cell.maxRpe; as rpe) {
          <span class="rpe">{{ rpe }}</span>
        }
      }
    </div>
  }
</div>
