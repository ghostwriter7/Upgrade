<div class="header" data-testid="session-calendar-month-label">{{ label() }}</div>
<div class="calendar">
  <div class="weekday">Mon</div>
  <div class="weekday">Tue</div>
  <div class="weekday">Wed</div>
  <div class="weekday">Thu</div>
  <div class="weekday">Fri</div>
  <div class="weekday">Sat</div>
  <div class="weekday">Sun</div>

  @for (cell of calendarCells(); track $index) {
    <div
      class="cell"
      [attr.data-testid]="cell.testId"
      [class.highlight]="cell.hasSessions"
      [class.empty]="cell.day === null"
      [routerLink]="['/session', cell.date]"
    >
      @if (cell.day !== null) {
        <span class="day">{{ cell.day }}</span>
      }
    </div>
  }
</div>
