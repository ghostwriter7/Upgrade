<div class="skill-coverage">
  <div class="actions">
    <mat-button-toggle-group class="full-width" [hideSingleSelectionIndicator]="true" [formField]="form.option"
                             aria-label="Last Days">
      @for (option of queryOptions; track option.value) {
        <mat-button-toggle [value]="option.value">{{ option.label }}</mat-button-toggle>
      }
    </mat-button-toggle-group>
  </div>

  <table mat-table matSort [dataSource]="skillCoverage()" class="mat-elevation-z8" (matSortChange)="onSortChange($event)" >

    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef>Skill</th>
      <td mat-cell *matCellDef="let element"> {{ element.skill | replace: '_' : ' ' | titlecase }}</td>
    </ng-container>

    <ng-container matColumnDef="count">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by count">Count</th>
      <td mat-cell *matCellDef="let element"> {{ element.count }}</td>
    </ng-container>

    <ng-container matColumnDef="daysAgo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by days ago">Days Ago</th>
      <td mat-cell *matCellDef="let element">
        @if (element.daysAgo === -1) {
          Never
        } @else {
          {{ element.daysAgo }}
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
