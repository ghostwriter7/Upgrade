<div class="nav">
  <button matMiniFab aria-label="Show previous month" (click)="showPreviousMonth()">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <span>{{ label() }}</span>

  <button matMiniFab aria-label="Show next month" (click)="showNextMonth()">
    <mat-icon>chevron_right</mat-icon>
  </button>
</div>
<div class="calendar">
  <div class="calendar__weekday">Mon</div>
  <div class="calendar__weekday">Tue</div>
  <div class="calendar__weekday">Wed</div>
  <div class="calendar__weekday">Thu</div>
  <div class="calendar__weekday">Fri</div>
  <div class="calendar__weekday">Sat</div>
  <div class="calendar__weekday">Sun</div>

  @for (cell of calendarCells(); track $index) {
    <div
      class="calendar__cell"
      [class.calendar__cell--has-session]="cell.hasSessions"
      [class.calendar__cell--empty]="cell.day === null"
      [routerLink]="['/session', cell.date]"
    >
      @if (cell.day !== null) {
        <span class="calendar__day">{{ cell.day }}</span>
      }
    </div>
  }
</div>
