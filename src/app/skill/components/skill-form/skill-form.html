<div class="skill-form">

  <section class="section">
    <h2>Skill</h2>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [formField]="form.name" placeholder="e.g. Front Split" autocomplete="off" />
    </mat-form-field>
  </section>

  <mat-divider />

  <section class="section">

    <div class="section-header">
      <div>
        <h2>Exercises</h2>
        <p>Exercises that develop the skill.</p>
      </div>

    </div>

    <div class="exercises">
      <mat-selection-list [formField]="form.exerciseIds">
        @for (exercise of exercises(); track exercise.name) {
          <mat-list-option togglePosition="after" [value]="exercise.id">
            <span matListItemTitle>{{ exercise.name }}</span>
          </mat-list-option>
        }
      </mat-selection-list>
    </div>

  </section>

  <div class="form-actions">

    <button matFab extended type="submit" [disabled]="form().invalid()" (click)="save()">
      <mat-icon>save</mat-icon>
      Save skill
    </button>

  </div>

</div>
