<div class="template-list">
  @for (template of templates(); track template) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title class="header">
          <mat-icon [class.active]="template.isFavourite" (click)="toggleFavourite(template)">star</mat-icon>

          {{ template.name }}
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        {{ template.description }}
      </mat-card-content>
    </mat-card>
  }
</div>
